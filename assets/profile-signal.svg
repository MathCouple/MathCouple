<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Animated data, distributed systems and AI signal</title>
  <desc id="desc">A compact animated systems map for Matheus A. showing data, AI, cloud, platform and production engineering domains.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#0ea5e9" stop-opacity=".12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <path id="orbitA" d="M550 150m-150 0a150 62 0 1 0 300 0a150 62 0 1 0-300 0"/>
    <path id="orbitB" d="M550 150m-220 0a220 95 0 1 1 440 0a220 95 0 1 1-440 0"/>
    <path id="busTop" d="M80 78H1020"/>
    <path id="busBottom" d="M80 222H1020"/>
  </defs>

  <rect width="1100" height="300" rx="28" fill="#020617"/>
  <rect width="1100" height="300" rx="28" fill="url(#grid)"/>
  <ellipse cx="550" cy="150" rx="300" ry="125" fill="url(#core)" filter="url(#soft)">
    <animate attributeName="opacity" values=".55;.9;.55" dur="4.8s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="none" stroke="url(#line)" stroke-linecap="round">
    <use href="#orbitA" stroke-width="1.3" stroke-opacity=".5" stroke-dasharray="4 12">
      <animate attributeName="stroke-dashoffset" values="0;-160" dur="7s" repeatCount="indefinite"/>
    </use>
    <use href="#orbitB" stroke-width="1" stroke-opacity=".28" stroke-dasharray="2 16">
      <animate attributeName="stroke-dashoffset" values="0;180" dur="12s" repeatCount="indefinite"/>
    </use>
    <use href="#busTop" stroke-width="1.1" stroke-opacity=".35" stroke-dasharray="2 14">
      <animate attributeName="stroke-dashoffset" values="0;-128" dur="5s" repeatCount="indefinite"/>
    </use>
    <use href="#busBottom" stroke-width="1.1" stroke-opacity=".35" stroke-dasharray="2 14">
      <animate attributeName="stroke-dashoffset" values="0;128" dur="5s" repeatCount="indefinite"/>
    </use>
  </g>

  <g filter="url(#glow)">
    <circle r="4" fill="#22d3ee"><animateMotion dur="5.2s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion></circle>
    <circle r="3" fill="#f472b6"><animateMotion dur="7.8s" begin="-2.1s" repeatCount="indefinite"><mpath href="#orbitB"/></animateMotion></circle>
    <circle r="3" fill="#8b5cf6"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#busTop"/></animateMotion></circle>
    <circle r="3" fill="#22d3ee"><animateMotion dur="6s" begin="-1.5s" repeatCount="indefinite"><mpath href="#busBottom"/></animateMotion></circle>
  </g>

  <g stroke="url(#line)" fill="#020617" stroke-width="1.5">
    <circle cx="220" cy="78" r="7"><animate attributeName="r" values="6;10;6" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="365" cy="222" r="7"><animate attributeName="r" values="6;10;6" dur="4.1s" begin="-.7s" repeatCount="indefinite"/></circle>
    <circle cx="735" cy="78" r="7"><animate attributeName="r" values="6;10;6" dur="3.8s" begin="-1.4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="222" r="7"><animate attributeName="r" values="6;10;6" dur="4.4s" begin="-2.1s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" text-anchor="middle">
    <text x="550" y="139" fill="#f8fafc" font-size="30" font-weight="700" letter-spacing="4">MATHEUS A.</text>
    <text x="550" y="166" fill="#94a3b8" font-size="11" letter-spacing="3">DATA · DISTRIBUTED SYSTEMS · AI</text>
    <text x="550" y="191" fill="#22d3ee" font-size="10" letter-spacing="2">PRODUCTION / RELIABILITY / OBSERVABILITY</text>

    <g fill="#cbd5e1" font-size="10" letter-spacing="1.6">
      <text x="220" y="59">DATA</text>
      <text x="365" y="246">CLOUD</text>
      <text x="735" y="59">AI / LLM</text>
      <text x="880" y="246">PLATFORM</text>
    </g>
  </g>

  <g opacity=".55" stroke="#22d3ee" stroke-width="1">
    <path d="M32 32h38M32 32v22M1068 32h-38M1068 32v22M32 268h38M32 268v-22M1068 268h-38M1068 268v-22"/>
  </g>

  <rect x="0" y="0" width="1100" height="8" fill="url(#line)" opacity=".12">
    <animate attributeName="y" values="0;292;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".04;.18;.04" dur="8s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="9" fill="#64748b" letter-spacing="1.2">
    <text y="287">
      PHARMACEUTICALS · AGRIBUSINESS · RETAIL · WHOLESALE · STARTUPS · REGULATED ENVIRONMENTS · FINANCIAL MARKETS · S&amp;P 500
      <animate attributeName="x" from="1100" to="-980" dur="22s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>