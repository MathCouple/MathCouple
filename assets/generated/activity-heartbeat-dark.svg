<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160" role="img" aria-labelledby="title desc">
<title id="title">GitHub activity heartbeat writing MALVES</title>
<desc id="desc">A contribution-driven heartbeat crosses the profile, changes color while writing MALVES in the center, then continues and repeats forever.</desc>
<defs>
  <filter id="glow" x="-160%" y="-160%" width="420%" height="420%">
    <feGaussianBlur stdDeviation="2.4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-140%" y="-140%" width="380%" height="380%">
    <feGaussianBlur stdDeviation="5.2"/>
  </filter>
</defs>

<!-- No static guide, calendar or hidden route: only the live signal is visible. -->
<path d="M40.0 104.0 L48.6 104.0 L54.0 104.0 L57.8 98.6 L61.1 107.4 L65.4 70.0 L69.7 121.0 L74.6 104.0 L84.3 104.0 L94.0 104.0 L102.6 104.0 L108.0 104.0 L111.8 98.6 L115.1 107.4 L119.4 70.0 L123.7 121.0 L128.6 104.0 L138.3 104.0 L148.0 104.0 L156.6 104.0 L162.0 104.0 L165.8 98.6 L169.1 107.4 L173.4 70.0 L177.7 121.0 L182.6 104.0 L192.3 104.0 L202.0 104.0 L210.6 104.0 L216.0 104.0 L219.8 98.6 L223.1 107.4 L227.4 70.0 L231.7 121.0 L236.6 104.0 L246.3 104.0 L256.0 104.0 L264.6 104.0 L270.0 104.0 L273.8 98.6 L277.1 107.4 L281.4 70.0 L285.7 121.0 L290.6 104.0 L300.3 104.0 L310.0 104.0" pathLength="1000" fill="none" stroke="#22d3ee" stroke-width="6.55"
      stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".10" stroke-dasharray="202 798" filter="url(#soft)">
  <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;.25;.29;1" dur="8.80s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;.13;.13;0;0" keyTimes="0;.03;.24;.29;1" dur="8.80s" repeatCount="indefinite"/>
</path>
