name: Generate activity heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-pipeline.yml"
      - "scripts/generate_activity_heartbeat.rb"
      - "scripts/malves.bf"

permissions:
  contents: write

concurrency:
  group: profile-heartbeat
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Validate heartbeat generator
        run: ruby -c scripts/generate_activity_heartbeat.rb

      - name: Read contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql \
            -f query='query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount weekday}}}}}}' \
            -F login='MathCouple' \
            > contribution-calendar.json

      - name: Generate activity heartbeat
        run: |
          ruby scripts/generate_activity_heartbeat.rb \
            contribution-calendar.json \
            assets/generated \
            scripts/malves.bf

      - name: Commit generated heartbeat to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/generated/activity-heartbeat.svg \
            assets/generated/activity-heartbeat-dark.svg
          if git diff --cached --quiet; then
            echo "Heartbeat assets already current"
          else
            git commit -m "chore(profile): refresh activity heartbeat"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
